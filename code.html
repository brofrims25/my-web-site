<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Video Hitam Merah</title>
    <style>
        body {
            background-color: #000; /* Hitam */
            color: #fff; /* Putih untuk teks */
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #b22222; /* Merah gelap */
            padding: 10px;
            text-align: center;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 20px;
        }
        .video-player {
            text-align: center;
            margin-bottom: 20px;
        }
        iframe {
            width: 100%;
            max-width: 800px;
            height: 450px;
            border: 2px solid #b22222;
        }
        .upload-form, .login-form {
            background-color: #333;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        input, button {
            padding: 10px;
            margin: 5px;
            border: none;
            border-radius: 3px;
        }
        button {
            background-color: #b22222;
            color: #fff;
            cursor: pointer;
        }
        button:hover {
            background-color: #ff0000;
        }
        .video-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .video-item {
            background-color: #333;
            padding: 10px;
            border-radius: 5px;
            width: 200px;
            text-align: center;
        }
        .video-item img {
            width: 100%;
            height: 120px;
            object-fit: cover;
        }
        .comments {
            margin-top: 20px;
            background-color: #111;
            padding: 15px;
            border-radius: 5px;
        }
        .comment {
            display: flex;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }
        .comment-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #b22222;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: bold;
            margin-right: 10px;
            flex-shrink: 0;
        }
        .comment-content {
            flex: 1;
        }
        .comment-header {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
        }
        .comment-user {
            font-weight: bold;
            margin-right: 10px;
        }
        .comment-time {
            color: #aaa;
            font-size: 12px;
        }
        .comment-text {
            line-height: 1.4;
        }
        .like-follow {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }
        .hidden {
            display: none;
        }
        /* Responsif untuk Android/Mobile */
        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            .video-list {
                flex-direction: column;
                align-items: center;
            }
            .video-item {
                width: 100%;
                max-width: 300px;
            }
            iframe {
                height: 250px;
            }
            .comment {
                flex-direction: column;
                align-items: flex-start;
            }
            .comment-avatar {
                margin-bottom: 10px;
                margin-right: 0;
            }
            .like-follow {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Website Video Hitam Merah</h1>
        <div id="login-status">Belum login</div>
        <div id="login-form" class="login-form">
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button onclick="login()">Login</button>
            <button onclick="logout()">Logout</button>
        </div>
    </header>

    <div class="container">
        <div class="video-player">
            <h2>Video Utama</h2>
            <iframe id="main-video" src="https://www.youtube.com/embed/lLJGB2fcZxY" allowfullscreen></iframe>
            <div class="like-follow">
                <button onclick="likeVideo()">Like (<span id="like-count">0</span>)</button>
                <button onclick="followUser()">Follow</button>
            </div>
            <div class="comments">
                <h3>Komentar</h3>
                <div id="comment-list"></div>
                <input type="text" id="comment-input" placeholder="Tulis komentar..." style="width: 80%;">
                <button onclick="addComment()">Kirim</button>
            </div>
        </div>

        <div class="upload-form">
            <h3>Upload Video (Link YouTube)</h3>
            <input type="text" id="video-link" placeholder="Masukkan link YouTube (contoh: https://youtu.be/...)" style="width: 70%;">
            <button onclick="uploadVideo()">Upload</button>
        </div>

        <h3>Daftar Video</h3>
        <div id="video-list" class="video-list"></div>
    </div>

    <script>
        let currentUser = null;
        let videos = JSON.parse(localStorage.getItem('videos')) || [
            { id: 'lLJGB2fcZxY', title: 'Video Pertama', embed: 'https://www.youtube.com/embed/lLJGB2fcZxY', comments: [], likes: 0, follows: 0 }
        ];
        let currentVideoIndex = 0;

        function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            if (username && password) {
                currentUser = username;
                document.getElementById('login-status').textContent = `Login sebagai: ${username}`;
                localStorage.setItem('user', username);
                alert('Login berhasil!');
            } else {
                alert('Masukkan username dan password!');
            }
        }

        function logout() {
            currentUser = null;
            document.getElementById('login-status').textContent = 'Belum login';
            localStorage.removeItem('user');
        }

        function loadUser() {
            const user = localStorage.getItem('user');
            if (user) {
                currentUser = user;
                document.getElementById('login-status').textContent = `Login sebagai: ${user}`;
            }
        }

        function uploadVideo() {
            if (!currentUser) {
                alert('Login dulu!');
                return;
            }
            const link = document.getElementById('video-link').value;
            if (link.includes('youtu.be/') || link.includes('youtube.com/watch?v=')) {
                const videoId = link.split('/').pop().split('?')[0];
                const embed = `https://www.youtube.com/embed/${videoId}`;
                videos.push({ id: videoId, title: `Video ${videos.length + 1}`, embed, comments: [], likes: 0, follows: 0 });
                localStorage.setItem('videos', JSON.stringify(videos));
                renderVideos();
                document.getElementById('video-link').value = '';
                alert('Video berhasil diupload!');
            } else {
                alert('Link YouTube tidak valid!');
            }
        }

        function renderVideos() {
            const list = document.getElementById('video-list');
            list.innerHTML = '';
            videos.forEach((video, index) => {
                const item = document.createElement('div');
                item.className = 'video-item';
                item.innerHTML = `
                    <img src="https://img.youtube.com/vi/${video.id}/0.jpg" alt="${video.title}">
                    <p>${video.title}</p>
                    <button onclick="playVideo(${index})">Putar</button>
                `;
                list.appendChild(item);
            });
        }

        function playVideo(index) {
            currentVideoIndex = index;
            const video = videos[index];
            document.getElementById('main-video').src = video.embed;
            document.getElementById('like-count').textContent = video.likes;
            renderComments(); // Pastikan komentar dirender saat ganti video
        }

        function likeVideo() {
            if (!currentUser) {
                alert('Login dulu!');
                return;
            }
            videos[currentVideoIndex].likes++;
            localStorage.setItem('videos', JSON.stringify(videos));
            document.getElementById('like-count').textContent = videos[currentVideoIndex].likes;
        }

        function followUser() {
            if (!currentUser) {
                alert('Login dulu!');
                return;
            }
            videos[currentVideoIndex].follows++;
            alert(`Anda follow video ini! Total follow: ${videos[currentVideoIndex].follows}`);
        }

        function addComment() {
            if (!currentUser) {
                alert('Login dulu!');
                return;
            }
            const comment = document.getElementById('comment-input').value;
            if (comment) {
                const time = new Date().toLocaleString(); // Tambah waktu
                videos[currentVideoIndex].comments.push({ user: currentUser, text: comment, time: time });
                localStorage.setItem('videos', JSON.stringify(videos));
                renderComments();
                document.getElementById('comment-input').value = '';
            }
        }

        function renderComments() {
            const list = document.getElementById('comment-list');
            list.innerHTML = '';
            videos[currentVideoIndex].comments.forEach(comment => {
                const item = document.createElement('div');
                item.className = 'comment';
                const avatarInitial = comment.user.charAt(0).toUpperCase(); // Inisial untuk avatar
                item.innerHTML = `
                    <div class="comment-avatar">${avatarInitial}</div>
                    <div class="comment-content">
                        <div class="comment-header">
                            <span class="comment-user">${comment.user}</span>
                            <span class="comment-time">${comment.time}</span>
                        </div>
                        <div class="comment-text">${comment.text}</div>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        // Inisialisasi
        loadUser();
        renderVideos();
        renderComments();
    </script>
</body>
</html>
